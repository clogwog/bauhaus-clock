body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:background .6s}
body.nofont{font-family:Georgia,serif}
#stage{transition:transform 2s ease;display:flex;gap:6vmin;align-items:center;justify-content:center}
.clock{width:var(--size);height:var(--size);position:relative}
.clock svg{width:100%;height:100%;overflow:visible}
.cap{text-align:center;font-size:1.6vmin;letter-spacing:.2em;text-transform:uppercase;opacity:.55;margin-top:2vmin}
#gear{position:fixed;right:20px;bottom:20px;width:44px;height:44px;border-radius:50%;border:0;background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink);cursor:pointer;font-size:20px;opacity:.35;transition:opacity .3s}
#gear:hover{opacity:1}
#panel{position:fixed;right:20px;bottom:76px;width:320px;max-height:calc(100vh - 100px);overflow:auto;background:rgba(250,250,250,.86);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:#111;border-radius:18px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.25);font-size:13px;display:none}
#panel.open{display:block}
#panel h3{margin:14px 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#777;font-weight:600}
#panel h3:first-child{margin-top:0}
.sw{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.sw button{aspect-ratio:1;border-radius:50%;border:1px solid rgba(0,0,0,.15);cursor:pointer;padding:0}
.sw button.on{outline:2px solid #0a84ff;outline-offset:2px}
.seg{display:flex;background:rgba(0,0,0,.07);border-radius:9px;padding:2px}
.seg button{flex:1;border:0;background:transparent;padding:6px 4px;border-radius:7px;cursor:pointer;font:inherit;color:#111}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.tg{appearance:none;width:38px;height:22px;border-radius:11px;background:#ccc;position:relative;cursor:pointer;transition:.2s}
.tg:checked{background:#34c759}.tg:before{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}.tg:checked:before{left:18px}
select,input[type=range]{width:100%;font:inherit}
</style></head><body>
<div id="stage"></div>
<button id="gear" aria-label="Settings">⚙</button>
<div id="panel">

 <h3 data-i="clocks">Clocks</h3><div class="seg" id="count"></div>

 <h3 data-i="opts">Options</h3>

</div>
<script>

const KEYS=['dial','move','style','clocks','tz2','size','opts','secs','nums','auto','burn','sysf','lang'];
const DEF={dial:'Noir',movement:'Digital',layout:'Classic',count:1,tz2:'Europe/London',size:70,seconds:true,numerals:true,night:false,burnin:true,sysfont:true,lume:false,lang:'en'};
const LUME_L={en:'Lume (glow)',fr:'Luminescence',de:'Leuchtmasse',es:'Luminiscencia',it:'Luminescenza',ja:'夜光',zh:'夜光',ru:'Люминесценция',tr:'Işıma',ar:'إضاءة ليلية'};
let S=Object.assign({},DEF,JSON.parse(localStorage.getItem('bauhausClock')||'{}'));
const save=()=>localStorage.setItem('bauhausClock',JSON.stringify(S));
const NS='http://www.w3.org/2000/svg';
function lum(h){h=h.replace('#','');if(h.length==3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return(0.299*(n>>16)+0.587*(n>>8&255)+0.114*(n&255))/255}
function face(){const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','-100 -100 200 200');
 const LU=S.lume,[bg,ink,idx,sec0]=LU?['#020405','#1a5560','#2ee6f0','#1f8f99']:DIALS[S.dial],light=!LU&&lum(bg)>0.55,compact=S.layout==='Compact';
 // Subtle matte style (reference photo): pale pill bars with a wide soft recessed groove, slim rounded hands.
 const edge=LU?'#1c2a30':light?'rgba(0,0,0,.28)':'rgba(0,0,0,.35)',so=LU?0:light?.35:.6;
 const CY='#2ee6f0',G=LU?`fill="url(#lc)" filter="url(#lg)"`:'fill="url(#pg)"';  // Lume: glowing cyan grooves
 const numC=LU?CY:(light?ink:'#ececec'),minC=light?ink:'#9a9a9a',minO=light?.5:1,tickC=LU?'#1a5560':(light?ink:'#777'),tickO=LU?.85:(light?.4:1);
 const secC=LU?'#0b1417':light?ink:'#e6e6e6';
 const PM=LU?'<stop offset="0" stop-color="#0c1113"/><stop offset=".5" stop-color="#141b1e"/><stop offset="1" stop-color="#0a0e10"/>':light?'<stop offset="0" stop-color="#2e2e2e"/><stop offset=".35" stop-color="#555"/><stop offset=".7" stop-color="#4a4a4a"/><stop offset="1" stop-color="#262626"/>':'<stop offset="0" stop-color="#d4d4d4"/><stop offset=".35" stop-color="#f1f1f1"/><stop offset=".7" stop-color="#ebebeb"/><stop offset="1" stop-color="#cbcbcb"/>';
 const PG=light?'<stop offset="0" stop-color="#1c1c1c"/><stop offset=".5" stop-color="#333"/><stop offset="1" stop-color="#4d4d4d"/>':'<stop offset="0" stop-color="#a6a6a6"/><stop offset=".5" stop-color="#c8c8c8"/><stop offset="1" stop-color="#e8e8e8"/>';
 let h=`<defs><linearGradient id="pm" x1="0" y1="0" x2="1" y2="0">${PM}</linearGradient>
 <linearGradient id="pg" x1="0" y1="0" x2="1" y2="0">${PG}</linearGradient>
 <linearGradient id="lc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1fc8d4"/><stop offset=".5" stop-color="#9ffaff"/><stop offset="1" stop-color="#1fc8d4"/></linearGradient>
 <radialGradient id="pc" cx="42%" cy="38%" r="70%"><stop offset="0" stop-color="#e2e2e2"/><stop offset="1" stop-color="#9c9c9c"/></radialGradient>
 <filter id="ds" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="-1.2" dy="1.8" stdDeviation=".15" flood-color="#000" flood-opacity="${so}"/></filter><filter id="lg" x="-300%" y="-60%" width="700%" height="220%"><feGaussianBlur in="SourceGraphic" stdDeviation="1.6" result="b"/><feGaussianBlur in="SourceGraphic" stdDeviation=".5" result="c"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
 if(!compact){h+='<g>';for(let i=0;i<60;i++)if(i%5)h+=`<rect x="-.48" y="-91.5" width=".96" height="6.2" rx=".3" fill="${tickC}" opacity="${tickO}" transform="rotate(${i*6})"/>`;h+='</g>';
 }
 h+='<g>';for(let i=0;i<12;i++){const q=i%3===0,w=q?4.4:4.2,L=q?17:14,y=q?-92:-91,gw=w*(LU?.36:.46);
  h+=`<g transform="rotate(${i*30})"><rect x="${-w/2}" y="${y}" width="${w}" height="${L}" rx="${w/2}" fill="url(#pm)" stroke="${edge}" stroke-width=".25"/><rect x="${-gw/2}" y="${y+2}" width="${gw}" height="${L-4}" rx="${gw/2}" ${G}/></g>`}
 h+='</g>';
 if(S.numerals){h+=`<g font-family="BauhausClockNum,'Lexend Exa',Futura,'Avenir Next',sans-serif" font-weight="400" font-size="9.2" fill="${numC}" text-anchor="middle"${LU?' filter="url(#lg)"':''}>`;
  for(let i=1;i<=12;i++){const a=i*Math.PI/6;h+=`<text x="${(Math.sin(a)*61).toFixed(2)}" y="${(-Math.cos(a)*61+3.3).toFixed(2)}">${i}</text>`}h+='</g>'}
 // slim, gently tapered hand with rounded tip and wide soft groove
 // Crisp per-part shadows, light from top-right: each shadow is a dark copy translated in UNROTATED space,
 // drawn right before its part (hour sh, hour, minute sh, minute, second sh, second, cap sh, cap).
 const SD=`translate(-1.2 1.8)`,shC=LU?'rgba(0,0,0,0)':light?'rgba(0,0,0,.35)':'rgba(0,0,0,.6)',MB=' style="mix-blend-mode:multiply"'; // multiply: shadow takes on the tone of what it falls on
 const handPath=(tip,tail,bw,tw)=>`M${-bw} ${-tail} L${-tw} ${-(tip-tw)} A${tw} ${tw} 0 0 1 ${tw} ${-(tip-tw)} L${bw} ${-tail} A${bw} ${bw} 0 0 1 ${-bw} ${-tail} Z`;
 const hand=(cls,tip,tail,bw,tw)=>{const gb=bw*(LU?.36:.45),gt=tw*(LU?.36:.45),g0=tip*.28,g1=tip-tw-3,d=handPath(tip,tail,bw,tw);
  return `<g transform="${SD}"${MB}><g class="${cls}s"><path d="${d}" fill="${shC}"/></g></g>`+
  `<g class="${cls}"><path d="${d}" fill="url(#pm)" stroke="${edge}" stroke-width=".25"/>`+
  `<path d="M${-gb} ${-g0} L${-gt} ${-g1} A${gt} ${gt} 0 0 1 ${gt} ${-g1} L${gb} ${-g0} A${gb} ${gb} 0 0 1 ${-gb} ${-g0} Z" ${G}/></g>`};
 // second hand: slim needle + elegant counterweight paddle (gently widening, rounded end, subtle groove)
 const sec=(fill,groove)=>`<path d="M-.45 0 L-.2 -91 L.2 -91 L.45 0 L.75 4 L1.35 22.6 A1.35 1.35 0 0 1 -1.35 22.6 L-.75 4 Z" fill="${fill}"/><circle r="2.6" fill="${fill}"/>`+
  (groove&&!LU?`<path d="M-.22 8 L-.5 21.5 A.5 .5 0 0 0 .5 21.5 L.22 8 Z" fill="rgba(0,0,0,.18)"/>`:'')+(groove&&LU?`<path d="M0 -14 L0 -84" stroke="#26b4c0" stroke-width=".35" stroke-linecap="round" opacity=".85" filter="url(#lg)"/>`:'');
 const hideS=S.seconds?'':' style="display:none"';
 h+=hand('hh',57,-2.5,2.1,1.35)+hand('mh',88,-2.5,1.75,1.0);
 h+=`<g transform="${SD}"${hideS}${MB}><g class="shs">${sec(shC,0)}</g></g><g class="sh"${hideS}>${sec(secC,1)}</g>`;
 h+=`<circle r="5.4" transform="${SD}" fill="${shC}"${MB}/>
  ${LU?'<circle r="5.4" fill="#06090a" stroke="#1c2a30" stroke-width=".5"/><circle r="2.4" fill="none" stroke="#15343a" stroke-width=".4"/>':`<circle r="5.4" fill="url(#pc)" stroke="rgba(0,0,0,.35)" stroke-width=".3"/><circle r="3.9" fill="#d8d8d8" stroke="rgba(0,0,0,.25)" stroke-width=".3"/><circle r="2.3" fill="url(#pc)"/><circle r="1" fill="#8d8d8d"/>`}`;
 s.innerHTML=h;return s}
function build(){const st=document.getElementById('stage');st.innerHTML='';const n=S.count;st.style.setProperty('--size',(n==2?S.size*0.55:S.size)+'vmin');
 for(let i=0;i<n;i++){const w=document.createElement('div');const c=document.createElement('div');c.className='clock';c.dataset.tz=i?S.tz2:'';c.appendChild(face());w.appendChild(c);
  if(n==2){const p=document.createElement('div');p.className='cap';p.textContent=i?S.tz2.split('/').pop().replace(/_/g,' '):Intl.DateTimeFormat().resolvedOptions().timeZone.split('/').pop().replace(/_/g,' ');w.appendChild(p)}st.appendChild(w)}}
function apply(){const [bg,ink,idx,sec]=S.lume?['#020405','#1a5560','#2ee6f0','#1f8f99']:DIALS[S.dial];const r=document.documentElement.style;r.setProperty('--bg',bg);r.setProperty('--ink',ink);r.setProperty('--idx',idx);r.setProperty('--sec',sec);
 document.body.classList.toggle('nofont',!S.sysfont);document.body.classList.toggle('grain',S.dial==='Noir'&&!S.lume);document.documentElement.lang=S.lang;
 const t=L[S.lang];document.querySelectorAll('[data-i]').forEach(e=>e.textContent=e.dataset.i==='lume'?LUME_L[S.lang]:t[KEYS.indexOf(e.dataset.i)+1]);
 seg('movement',['Quartz','Mechanical','Digital'],[14,15,16]);seg('layout',['Classic','Compact'],[17,18]);seg('count',[1,2],[19,20]);
 document.querySelectorAll('#dials button').forEach(b=>b.classList.toggle('on',b.title===S.dial));
 ['seconds','numerals','night','burnin','sysfont','lume'].forEach(k=>document.getElementById(k).checked=S[k]);
 size.value=S.size;lang.value=S.lang;tz2.value=S.tz2;tz2.style.display=tzrow.style.display=S.count==2?'':'none';build();save()}
function seg(id,vals,li){const el=document.getElementById(id);el.innerHTML='';vals.forEach((v,i)=>{const b=document.createElement('button');b.textContent=L[S.lang][li[i]];b.className=S[id]==v?'on':'';b.onclick=()=>{S[id]=v;apply()};el.appendChild(b)})}
Object.keys(DIALS).forEach(n=>{const b=document.createElement('button');b.title=n;b.style.background=DIALS[n][0];b.onclick=()=>{S.dial=n;apply()};dials.appendChild(b)});
Object.keys(L).forEach(k=>lang.add(new Option(L[k][0],k)));
['Europe/London','America/New_York','America/Los_Angeles','Asia/Tokyo','Asia/Shanghai','Asia/Dubai','Europe/Paris','Europe/Berlin','Europe/Amsterdam','Australia/Melbourne','Asia/Singapore','America/Sao_Paulo'].forEach(z=>tz2.add(new Option(z.replace(/_/g,' '),z)));
['seconds','numerals','night','burnin','sysfont','lume'].forEach(k=>document.getElementById(k).onchange=e=>{S[k]=e.target.checked;apply()});
size.oninput=e=>{S.size=+e.target.value;apply()};lang.onchange=e=>{S.lang=e.target.value;apply()};tz2.onchange=e=>{S.tz2=e.target.value;apply()};
gear.onclick=()=>panel.classList.toggle('open');addEventListener('keydown',e=>{if(e.key==='Escape')panel.classList.remove('open');if(e.key===','||e.key==='s')panel.classList.toggle('open')});
function parts(tz){const d=new Date();if(!tz)return{h:d.getHours(),m:d.getMinutes(),s:d.getSeconds(),ms:d.getMilliseconds()};
 const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'numeric',minute:'numeric',second:'numeric',hourCycle:'h23'}).formatToParts(d).map(x=>[x.type,+x.value]));return{h:p.hour,m:p.minute,s:p.second,ms:d.getMilliseconds()}}
function tick(){document.querySelectorAll('.clock').forEach(c=>{const t=parts(c.dataset.tz);let s;
 if(S.movement==='Quartz'){const f=Math.min(t.ms/120,1);s=t.s-1+(f<1?1-Math.pow(1-f,3)+Math.sin(f*Math.PI)*0.04:1)}  // tick with slight overshoot
 else if(S.movement==='Mechanical')s=t.s+Math.floor(t.ms/125)/8; // 28,800 bph = 8 beats/sec
 else s=t.s+t.ms/1000;
 const m=t.m+(t.s+t.ms/1000)/60,h=(t.h%12)+m/60;
 for(const [k,v] of [['hh',h*30],['mh',m*6],['sh',s*6]]){const r=`rotate(${v})`;c.querySelector('.'+k).setAttribute('transform',r);c.querySelector('.'+k+'s').setAttribute('transform',r)}});
 const hr=new Date().getHours();document.getElementById('stage').style.opacity=S.night&&(hr>=22||hr<7)?.45:1;
 requestAnimationFrame(tick)}
setInterval(()=>{if(!S.burnin){stage.style.transform='';return}const t=Date.now()/60000;stage.style.transform=`translate(${Math.sin(t*0.7)*1.2}vmin,${Math.cos(t*0.9)*1.2}vmin)`},5000);
apply();tick();
</script></body></html>
